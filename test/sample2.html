<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>本地测试站 · 第2页</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; }
  .navbar { display: flex; gap: 18px; padding: 12px 20px; background: #2c3e50; }
  .navbar a { color: #ecf0f1; text-decoration: none; font-size: 14px; }
  h1 { margin: 16px 20px; font-size: 22px; }
  .list { max-width: 760px; margin: 20px auto; }
  .item { display: flex; gap: 12px; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px; margin-bottom: 12px; background: #fff; }
  .item img { width: 64px; height: 64px; border-radius: 8px; background: #ced6e0; }
  .item h3 { margin: 0 0 6px; font-size: 16px; }
  .item h3 a { color: #2f3542; text-decoration: none; }
  .item .desc { color: #747d8c; font-size: 13px; margin-bottom: 6px; }
  .item .price { color: #e17055; font-weight: bold; }
  .pager { display: flex; gap: 10px; justify-content: center; padding: 20px 0 40px; }
  .pager a { padding: 8px 18px; background: #2f6fd6; color: #fff; border-radius: 6px; text-decoration: none; }
</style>
</head>
<body>
  <nav class="navbar">
    <a href="#">首页</a><a href="#">分类</a><a href="#">排行</a><a href="#">关于</a><a href="#">帮助</a>
  </nav>
  <h1>商品列表（第2页，静态 12 条）</h1>
  <div class="list" id="list"></div>
  <div class="pager"><a href="sample1.html">‹ 上一页</a></div>
<script>
  const names = ['羊毛围巾','真皮钱包','双肩背包','保温饭盒','硅胶铲具','瑜伽垫','跳绳','哑铃','羽毛球拍','泳镜','帐篷','睡袋'];
  names.forEach((name, i) => {
    const price = (Math.round(Math.random() * 50000) / 100 + 29.9).toFixed(2);
    const div = document.createElement('div');
    div.className = 'item product';
    div.innerHTML = '<img alt="pic"><div class="info"><h3><a href="#">' + name + '</a></h3>' +
      '<div class="desc">第二页第' + (i + 1) + '号商品，精选好物。</div>' +
      '<span class="price">¥' + price + '</span></div>';
    document.getElementById('list').appendChild(div);
  });
</script>
</body>
</html>
