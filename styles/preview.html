<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>采集助手 V6 · 风格方案</title>
<style>
/* ═══ 公共骨架 ═══ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; }
body { width: 1440px; height: 900px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
.app { display: block; width: 1440px; height: 900px; position: relative; }

.tb { position: absolute; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:10px; padding:0 14px; z-index:20; }
.brand { display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; white-space:nowrap; }
.brand .mark { width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:12px; font-weight:800; }
.ticons { display:flex; gap:2px; }
.ticon { width:30px; height:30px; border:none; background:transparent; border-radius:6px; display:grid; place-items:center; cursor:pointer; }
.ticon svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.url { flex:1; height:34px; padding:0 12px; border-radius:8px; outline:none; font-size:12.5px; }
.gobtn { height:34px; padding:0 16px; border:none; border-radius:8px; font-size:12.5px; cursor:pointer; }
.sp { flex:1 }
.pill { height:32px; padding:0 14px; border-radius:999px; font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.pill .dot { width:6px; height:6px; border-radius:50%; }
.stop { width:34px; height:34px; border:none; border-radius:8px; cursor:pointer; display:grid; place-items:center; }
.stop svg { width:13px; height:13px; fill:currentColor; }
.cta { height:36px; padding:0 20px; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.cta svg { width:13px; height:13px; fill:currentColor; }

.side { position:absolute; top:52px; right:0; bottom:236px; width:324px; padding:0 16px; overflow:hidden; z-index:10; }
.wf { padding:16px 0 12px; display:flex; flex-direction:column; gap:8px; align-items:center; }
.step { display:flex; align-items:center; gap:9px; padding:6px 16px 6px 7px; font-size:12px; }
.step i { width:21px; height:21px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:700; }
.step.ok i::before { content:"✓"; }
.tabs { display:flex; gap:20px; padding:2px 0 0; }
.tab { padding:8px 2px; font-size:13px; cursor:pointer; background:none; border:none; }
.card { border-radius:10px; padding:13px; margin-top:12px; }
.ct { font-size:12px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.ct::before { content:""; width:3px; height:12px; border-radius:2px; }
.detect { width:100%; height:38px; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
.detect svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
.fld { display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:7px; font-size:12px; }
.fld input { width:13px; height:13px; }
.fld .fn { width:78px; font-weight:500; }
.fld .ft { font-size:10px; padding:1px 7px; border-radius:999px; }
.fld .fs { flex:1; font-size:11px; opacity:.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.stage { position:absolute; top:52px; left:0; right:324px; bottom:236px; background:#fff; overflow:hidden; }
.site { padding:20px 30px; }
.site h1 { font-size:19px; margin-bottom:16px; color:#222; }
.prod { display:flex; gap:14px; border:2px solid; border-radius:10px; padding:12px; margin-bottom:12px; position:relative; background:#fff; }
.prod .no { position:absolute; top:-1px; left:-1px; width:24px; height:20px; border-radius:8px 0 8px 0; color:#fff; font:700 12px/20px Bahnschrift, sans-serif; text-align:center; }
.prod .img { width:58px; height:58px; border-radius:8px; background:linear-gradient(135deg,#dfe3ea,#cdd3de); }
.prod h3 { font-size:14.5px; color:#1c2430; margin-bottom:5px; }
.prod .in { outline:1px solid #9ec3f7; outline-offset:2px; }
.prod .desc { font-size:12.5px; color:#7a8496; margin-bottom:6px; }
.prod .pr { font-size:14px; font-weight:700; }
.tip { position:absolute; top:16px; right:16px; width:270px; border-radius:10px; overflow:hidden; }
.tip .th { display:flex; align-items:center; gap:8px; padding:9px 12px; color:#fff; font-size:13px; font-weight:600; }
.tip .th .x { margin-left:auto; opacity:.9; font-size:14px; }
.tip .tb2 { padding:11px 13px; font-size:12.5px; line-height:1.75; }
.tip .ti { display:flex; align-items:center; gap:9px; padding:10px 13px; font-size:12.5px; cursor:pointer; }
.tip .ti small { margin-left:auto; opacity:.5; font-size:10.5px; }
.tip .ti svg { width:15px; height:15px; fill:none; stroke-width:2; stroke-linecap:round; }

.pv { position:absolute; left:0; right:0; bottom:0; height:236px; border-top:1px solid; display:flex; flex-direction:column; }
.pvh { display:flex; align-items:center; gap:10px; padding:9px 16px; }
.pvh b { font-size:13px; }
.count { font-size:11px; padding:2px 9px; border-radius:999px; font-family:Bahnschrift, sans-serif; }
.pv table { border-collapse:collapse; width:100%; font-size:12.5px; }
.pv th, .pv td { padding:6px 16px; text-align:left; }
.pv thead tr { border-bottom:1px solid; }
